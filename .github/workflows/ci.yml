# Requires a macOS runner with Xcode 26+ (iOS 26 SDK).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: make lint

  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: script -q /dev/null make test TEST_FLAGS=--no-parallel

  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # lfs: the Core ML weights are LFS-tracked; without this the runner gets a
      # pointer file and coremlc fails. Only the jobs that compile need them.
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: brew install xcodegen
      - run: make generate
      - name: Resolve packages (retry on flaky release downloads)
        run: |
          cd app/WardrobeApp
          for i in 1 2 3; do
            xcodebuild -project WardrobeApp.xcodeproj -scheme WardrobeApp \
              -resolvePackageDependencies && exit 0
            echo "resolve attempt $i failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - run: make build DEST='generic/platform=iOS Simulator'
