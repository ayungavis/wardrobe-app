included:
  - app

excluded:
  - app/WardrobeApp/WardrobeKit/.build

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional

disabled_rules:
  # Trailing commas keep multi-line diffs small; TODOs are tracked against PRD FR-ids.
  - trailing_comma
  - todo

line_length:
  warning: 130
  ignores_comments: true

identifier_name:
  min_length: 2
