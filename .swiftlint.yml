included:
  - app

excluded:
  - app/WardrobeApp/WardrobeKit/.build

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional

disabled_rules:
  # Trailing commas keep multi-line diffs small; TODOs are tracked against PRD FR-ids.
  - trailing_comma
  - todo

line_length:
  warning: 130
  ignores_comments: true

identifier_name:
  min_length: 2
  # `x`/`y` mirror CGPoint on the two geometry value types; anything shorter
  # than these is renamed, not excused.
  allowed_symbols: []
  excluded:
    - x
    - y

redundant_discardable_let:
  # `let _ = sideEffect()` is the only way to run a Void call inside a
  # ViewBuilder, which is what the previews need for font registration.
  ignore_swiftui_view_bodies: true
