[workspace]
resolver = "3"
members = ["crates/api", "crates/db", "crates/observability", "crates/storage", "crates/worker"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
axum = "0.8"
aws-sdk-s3 = { version = "1.96", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
getrandom = "0.3"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "1"
sentry = { version = "0.46", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
    "tokio",
    "tower",
    "tracing",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "rust_decimal",
  "tls-rustls",
  "uuid",
] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
# v7 only: every id in this schema is a time-ordered UUIDv7 minted in Rust, so
# the database never needs a uuid default (docs/backend-schema.md §2).
uuid = { version = "1", features = ["serde", "v7"] }

# Debug symbols are a third of the shipped binary and buy nothing in production;
# panics still carry file and line.
[profile.release]
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
