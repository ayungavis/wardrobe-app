# One compose file for local development and the single production VPS
# (PRD §20 Deployment). Environment selects the differences, not a second file.
name: wardrobe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wardrobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wardrobe}
      POSTGRES_DB: ${POSTGRES_DB:-wardrobe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without this, `make migrate` races the first boot and fails once.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wardrobe} -d ${POSTGRES_DB:-wardrobe}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3-compatible from day one so local code is identical to production, where
  # this service is replaced by Cloudflare R2 (PRD §20 Object storage).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wardrobe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wardrobe-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  minio-data:
