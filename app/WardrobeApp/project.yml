name: WardrobeApp
options:
  bundleIdPrefix: com.ayungavis
  deploymentTarget:
    iOS: "26.0"

configFiles:
  Debug: WardrobeApp/Config/Debug.xcconfig
  Release: WardrobeApp/Config/Release.xcconfig

packages:
  WardrobeKit:
    path: WardrobeKit
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"

targets:
  WardrobeApp:
    type: application
    platform: iOS
    sources:
      - path: WardrobeApp
        excludes:
          - "Config/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayungavis.WardrobeApp
        SWIFT_VERSION: "6.0"
        # PRD §20: MVP targets iPhone portrait only.
        TARGETED_DEVICE_FAMILY: "1"
        # Binds AppIcon.icon (Icon Composer) to the target — the name must match
        # the .icon file's base name. XcodeGen supplies this value by default,
        # but an implicit default is not documentation, and the .xcodeproj that
        # carries it is generated and gitignored.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # CI overrides CURRENT_PROJECT_VERSION with the run number for TestFlight.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: QHL64K2LPL
          PROVISIONING_PROFILE_SPECIFIER: WardrobeApp Apple Distribution
    entitlements:
      path: WardrobeApp/WardrobeApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: WardrobeApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - id
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SentryDSN: $(SENTRY_DSN)
        SentryEnvironment: $(SENTRY_ENVIRONMENT)
        APIBaseURL: $(API_BASE_URL)
        ConsentAIProvider: $(CONSENT_AI_PROVIDER)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Finds the development backend running on your Mac over Wi-Fi. Release builds talk to the hosted API and never use the local network.
        NSCameraUsageDescription: The camera is used to photograph your outfit for the daily challenge. Photos stay on your device until you choose to share them.
        NSPhotoLibraryAddUsageDescription: Lets you save your edited outfit photo to your photo library.
        NSPhotoLibraryUsageDescription: Shows your most recent photo on the gallery button so you can import an outfit photo quickly. You can still pick photos without granting this.
    dependencies:
      - package: WardrobeKit
        product: WardrobeKit
      - package: WardrobeKit
        product: DesignSystem
      - package: Sentry
        product: Sentry
    scheme:
      testTargets: []
